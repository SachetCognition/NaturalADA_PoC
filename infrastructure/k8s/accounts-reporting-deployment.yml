apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounts-reporting-service
  labels:
    app: accounts-reporting-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: accounts-reporting-service
  template:
    metadata:
      labels:
        app: accounts-reporting-service
    spec:
      containers:
        - name: accounts-reporting-service
          image: insurance/accounts-reporting-service:latest
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/insurance
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: accounts-reporting-service
spec:
  selector:
    app: accounts-reporting-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8082
  type: ClusterIP
