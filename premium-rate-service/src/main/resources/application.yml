spring:
  application:
    name: premium-rate-service

  datasource:
    url: jdbc:postgresql://localhost:5432/insurance
    username: insurance
    password: insurance
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

server:
  port: 8081
